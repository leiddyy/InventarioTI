server {
    listen 80;
    server_name _; # Ou o IP da VM / domínio

    # Tamanho máximo de upload (para PDFs e fotos dos termos assinados)
    client_max_body_size 50M;

    # Frontend (Arquivos estáticos compilados pelo Vite)
    location / {
        root /var/www/inventario-ti/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend (FastAPI / Uvicorn na porta 8000)
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
